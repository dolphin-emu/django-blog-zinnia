{% load i18n zinnia %}
{% get_site_domain as search_domain %}
<form method="get" action="https://google.com/search" role="search"
      id="{{ search_form_id|default:'searchform' }}">
  {% block search_filters %}
  {% if search_domain %}
  <input type="hidden" name="as_sitesearch" value="{{ search_domain }}" />
  {% endif %}
  {% endblock %}
  {% block search_fields %}
  <p>
    <input type="text" name="q" id="{{ search_box_id|default:'searchbox' }}" placeholder="{% trans "Keywords..." %}" required />
    <input type="submit" class="submitbutton" value="OK" />
  </p>
  {% endblock %}
</form>
